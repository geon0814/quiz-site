async function saveArticle(){
  const title=document.getElementById('ef-title').value.trim();
  if(!title){alert('제목을 입력하세요.');return;}
  const type=getSelectedType();
  const base={
    id:editingIdx>=0?state.articles[editingIdx].id:genId(),
    type, num:document.getElementById('ef-num').value.trim()||'?',
    title, when:document.getElementById('ef-when').value.trim(),
    points:parseFloat(document.getElementById('ef-points').value)||1,
    bogi:document.getElementById('ef-bogi').value.trim(),
    bogi2:document.getElementById('ef-bogi2').value.trim(),
    subText:document.getElementById('ef-sub-text').value.trim(),
    subImage:currentSubImageB64||null,
    note:document.getElementById('ef-note').value.trim(),
    explanation:document.getElementById('ef-explanation').value.trim(),
    unit:document.getElementById('ef-unit').value.trim(),
    intent:document.getElementById('ef-intent').value.trim(),
    image:currentImageB64||null,
    groupNext:document.getElementById('ef-group-next').checked,
    groupLabel:document.getElementById('ef-group-label').value.trim()
  };
  let art;
  if(type==='blank'){
    const blanks=readBlanks();
    if(blanks.some(b=>!b.answer.trim())) if(!confirm('정답이 비어 있는 빈칸이 있습니다. 저장하시겠습니까?')) return;
    art={...base,blanks};
  } else if(type==='cloze'){
    const clozeText=document.getElementById('ef-cloze-text').value;
    const clozeAnswers=document.getElementById('ef-cloze-answers').value.split('/').map(s=>s.trim()).filter(Boolean);
    art={...base,clozeText,clozeAnswers};
  } else if(type==='choice'){
    const {choices,answerIdx}=readChoices();
    art={...base,question:document.getElementById('ef-question').value,choices,answerIdx};
  } else if(type==='multi'){
    const {choices,answerIdxs}=readMultiChoices();
    art={...base,question:document.getElementById('ef-question').value,choices,answerIdxs};
  } else {
    art={...base,question:document.getElementById('ef-question').value,answer:document.getElementById('ef-essay-ans').value};
  }
  if(!currentSetId){ alert('퀴즈 세트를 먼저 선택하세요.'); return; }
  if(editingIdx===-1) state.articles.push(art);
  else state.articles[editingIdx]=art;
  const {error}=await sb.from('quiz_sets').update({
    articles: state.articles,
    config: state.config
  }).eq('id', currentSetId);
  if(error){ alert('저장 오류: '+error.message); return; }
  cancelEdit();
}

/* ── DOCX 내보내기 ───────────────────────────────────── */
function base64ToUint8Array(b64) {
  const raw = atob(b64.includes(',') ? b64.split(',')[1] : b64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function exportToDocx() {
  if (!state.articles.length) { alert('문제가 없습니다.'); return; }
  if (!window.docx) {
    /* 최대 5초 대기 */
    for(let i=0;i<10;i++){
      await new Promise(r=>setTimeout(r,500));
      if(window.docx) break;
    }
    if(!window.docx){ alert('라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도하세요.'); return; }
  }

  const {
    Document, Paragraph, TextRun, ImageRun, ExternalHyperlink,
    AlignmentType, BorderStyle,
    Table, TableRow, TableCell, WidthType,
    Packer, SectionType
  } = window.docx;

  const cfg = state.config;
  const TL  = { blank:'빈칸 퀴즈', cloze:'지문형 빈칸', choice:'객관식', multi:'복수선택', essay:'서술형' };

  /* 섹션별 배열 */
  const titleChildren = [];    // 제목 (전체폭)
  const qChildren     = [];    // 문제 (2단 컬럼, 자동 흐름)
  const tableChildren = [];    // 정답·해설 표 (전체폭)

  const PAGE_PROP = {
    page: {
      size: { width: 11906, height: 16838 },          // A4
      margin: { top: 1134, bottom: 1134, left: 1440, right: 1440 }
    }
  };
  const W = 9026; // 본문 너비 twips (11906 - 1440*2)

  /* 문서 제목 */
  titleChildren.push(new Paragraph({
    children: [new TextRun({ text: cfg.title, bold: true, size: 52, color: '1c2b3a' })],
    alignment: AlignmentType.CENTER,
    spacing: { after: 120 }
  }));
  titleChildren.push(new Paragraph({
    children: [new TextRun({ text: `${cfg.issue}  ·  기준일 ${cfg.date}`, size: 20, color: '888888' })],
    alignment: AlignmentType.CENTER,
    spacing: { after: 200 }
  }));

  /* ── 문제 콘텐츠 빌더 ── */
  const COL_W = Math.floor((W - 500) / 2); // 각 컬럼 너비 (참고용)

  const B = { style: BorderStyle.SINGLE, size: 12, color: '1c2b3a' };
  const buildBogiParas = (art, field='bogi') => {
    if (!art[field]) return [];
    const cellChildren = [
      new Paragraph({
        children: [new TextRun({ text: '보  기', bold: true, size: 20, color: '1c2b3a' })],
        alignment: AlignmentType.CENTER,
        spacing: { before: 60, after: 60 },
        border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: 'c9bd9a' } }
      }),
      ...art[field].split('\n').map(line => new Paragraph({
        children: [new TextRun({ text: line, size: 20 })],
        spacing: { before: 40, after: 40 }
      }))
    ];
    return [
      new Paragraph({ spacing: { before: 80, after: 0 } }),
      new Table({
        rows: [new TableRow({ children: [new TableCell({
          children: cellChildren,
          borders: { top: B, bottom: B, left: B, right: B },
          margins: { top: 60, bottom: 60, left: 120, right: 120 }
        })] })],
        width: { size: 5000, type: WidthType.PERCENTAGE }
      }),
      new Paragraph({ spacing: { before: 0, after: 160 } })
    ];
  };

  const buildSubParas = (art) => {
    const ps = [];
    if (art.subText) {
      art.subText.split('\n').forEach(line => ps.push(new Paragraph({
        children: [new TextRun({ text: line, size: 20 })],
        spacing: { before: 40, after: 40 }
      })));
      ps.push(new Paragraph({ spacing: { after: 80 } }));
    }
    if (art.subImage) {
      try {
        const imgData = base64ToUint8Array(art.subImage);
        ps.push(new Paragraph({
          children: [new ImageRun({ data: imgData, transformation: { width: 260, height: 160 }, type: 'jpeg' })],
          alignment: AlignmentType.CENTER, spacing: { after: 120 }
        }));
      } catch(e) {}
    }
    return ps;
  };

  const buildArtContent = (art) => {
    const ps = [];
    /* 제목 */
    ps.push(new Paragraph({
      children: [
        new TextRun({ text: `${art.num}  `, bold: true, size: 24, color: 'a3312a' }),
        new TextRun({ text: art.title, bold: true, size: 24 }),
        new TextRun({ text: `  [${TL[art.type]||''}]`, size: 18, color: '888888' }),
        new TextRun({ text: `  [${art.type==='cloze'?((art.points||0)===0?(art.clozeAnswers||[]).length:art.points):(art.points||1)}점]`, size: 18, color: 'a3312a' })
      ],
      spacing: { before: 0, after: 80 },
      border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: 'c9bd9a' } }
    }));
    /* 출처 */
    if (art.when) ps.push(new Paragraph({
      children: [new TextRun({ text: art.when, size: 16, color: '999999', italics: true })],
      spacing: { after: 100 }
    }));
    /* 이미지 */
    if (art.image) {
      try {
        const imgData = base64ToUint8Array(art.image);
        ps.push(new Paragraph({
          children: [new ImageRun({ data: imgData, transformation: { width: 290, height: 180 }, type: 'jpeg' })],
          alignment: AlignmentType.CENTER, spacing: { after: 140 }
        }));
      } catch(e) {
        ps.push(new Paragraph({ children: [new TextRun({ text: '[이미지]', color: '999999' })], spacing: { after: 100 } }));
      }
    }
    const pushQ = () => { if (art.question) ps.push(new Paragraph({ children: [new TextRun({ text: art.question, size: 20 })], spacing: { after: 140 } })); };
    /* 빈칸형: bogi → bogi2 → sub → blanks */
    if (art.type === 'blank') {
      ps.push(...buildBogiParas(art));
      ps.push(...buildBogiParas(art, 'bogi2'));
      ps.push(...buildSubParas(art));
      (art.blanks || []).forEach((b, bi) => {
        ps.push(new Paragraph({
          children: [
            new TextRun({ text: `${art.num}-${bi+1}.  `, bold: true, color: 'a3312a', size: 20 }),
            new TextRun({ text: b.pre + ' ', size: 20 }),
            new TextRun({ text: '____________', size: 20, color: 'aaaaaa' }),
            new TextRun({ text: ' ' + b.post, size: 20 })
          ],
          spacing: { after: 140 }
        }));
      });
    /* 지문형 빈칸: bogi → bogi2 → sub → cloze text */
    } else if (art.type === 'cloze') {
      ps.push(...buildBogiParas(art));
      ps.push(...buildBogiParas(art, 'bogi2'));
      ps.push(...buildSubParas(art));
      const CLOZE_RE = /\{(\*+)\}/g;
      const text = art.clozeText || '';
      let last = 0, m, children = [];
      CLOZE_RE.lastIndex = 0;
      while ((m = CLOZE_RE.exec(text)) !== null) {
        if (m.index > last) children.push(new TextRun({ text: text.slice(last, m.index), size: 20 }));
        children.push(new TextRun({ text: '_'.repeat(Math.max(4, m[1].length)), size: 20, color: 'aaaaaa', underline: {} }));
        last = m.index + m[0].length;
      }
      if (last < text.length) children.push(new TextRun({ text: text.slice(last), size: 20 }));
      text.split('\n').forEach(line => {
        const lineChildren = [];
        let li = 0;
        CLOZE_RE.lastIndex = 0;
        let lm;
        while ((lm = CLOZE_RE.exec(line)) !== null) {
          if (lm.index > li) lineChildren.push(new TextRun({ text: line.slice(li, lm.index), size: 20 }));
          lineChildren.push(new TextRun({ text: '_'.repeat(Math.max(4, lm[1].length)), size: 20, color: '888888' }));
          li = lm.index + lm[0].length;
        }
        if (li < line.length) lineChildren.push(new TextRun({ text: line.slice(li), size: 20 }));
        ps.push(new Paragraph({ children: lineChildren.length ? lineChildren : [new TextRun({ text: line, size: 20 })], spacing: { after: 60 } }));
      });
    /* 객관식: bogi → question → bogi2 → sub → choices */
    } else if (art.type === 'choice') {
      ps.push(...buildBogiParas(art));
      pushQ();
      ps.push(...buildBogiParas(art, 'bogi2'));
      ps.push(...buildSubParas(art));
      (art.choices || []).forEach((c, ci) => {
        ps.push(new Paragraph({
          children: [new TextRun({ text: `  ${CHOICE_LABELS[ci]||ci+1}  ${c.text}`, size: 20 })],
          spacing: { after: 100 }
        }));
      });
    /* 서술형: bogi → question → bogi2 → sub → answer lines */
    } else if (art.type === 'essay') {
      ps.push(...buildBogiParas(art));
      pushQ();
      ps.push(...buildBogiParas(art, 'bogi2'));
      ps.push(...buildSubParas(art));
      for (let ln = 0; ln < 3; ln++) {
        ps.push(new Paragraph({
          children: [new TextRun({ text: '' })],
          border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: 'dddddd' } },
          spacing: { after: 100 }
        }));
      }
    /* 복수선택: bogi → question → bogi2 → sub → choices */
    } else if (art.type === 'multi') {
      ps.push(...buildBogiParas(art));
      pushQ();
      ps.push(...buildBogiParas(art, 'bogi2'));
      ps.push(...buildSubParas(art));
      (art.choices || []).forEach((c, ci) => {
        const label = c.label || MULTI_DEFAULT_LABELS[ci] || String(ci+1);
        ps.push(new Paragraph({
          children: [new TextRun({ text: `  ${label}  ${c.text}`, size: 20 })],
          spacing: { after: 100 }
        }));
      });
    }
    /* 비고 */
    if (art.note) ps.push(new Paragraph({
      children: [new TextRun({ text: `※ ${art.note}`, size: 18, color: '666666', italics: true })],
      spacing: { before: 80, after: 60 }
    }));
    return ps;
  };

  /* 문제 내용을 2단 컬럼 섹션에 flat하게 추가 */
  const B_GROUP = { style: BorderStyle.SINGLE, size: 8, color: 'c9bd9a' };
  for (let i = 0; i < state.articles.length; i++) {
    const art = state.articles[i];
    if (art.groupNext && i + 1 < state.articles.length) {
      const next = state.articles[i + 1];
      const nums = `${art.num}~${next.num}`;
      qChildren.push(new Paragraph({
        children: [new TextRun({ text: `[${nums}] ${art.groupLabel||''}`, size: 20, bold: true, color: '1c2b3a' })],
        spacing: { before: 60, after: 80 },
        border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: 'c9bd9a' }, top: B_GROUP, left: B_GROUP, right: B_GROUP }
      }));
      buildArtContent(art).forEach(p => qChildren.push(p));
      qChildren.push(new Paragraph({ spacing: { after: 160 } }));
      buildArtContent(next).forEach(p => qChildren.push(p));
      qChildren.push(new Paragraph({ spacing: { after: 300 } }));
      i++;
    } else {
      buildArtContent(art).forEach(p => qChildren.push(p));
      qChildren.push(new Paragraph({ spacing: { after: 300 } }));
    }
  }

  /* ── 정답 정리 표 (tableChildren) ── */
  tableChildren.push(new Paragraph({
    children: [new TextRun({ text: '정답 정리', bold: true, size: 40, color: '1c2b3a' })],
    spacing: { after: 200 },
    border: { bottom: { style: BorderStyle.DOUBLE, size: 6, color: 'c9bd9a' } }
  }));

  const mkCellAns = (text, opts={}) => new TableCell({
    children: [new Paragraph({
      children: [new TextRun({ text, size: opts.size||20, bold: opts.bold||false, color: opts.color||'1c2b3a' })],
      spacing: { before: 60, after: 60 }
    })],
    width: opts.w ? { size: opts.w, type: WidthType.DXA } : undefined,
    shading: opts.fill ? { fill: opts.fill } : undefined,
    margins: { top: 80, bottom: 80, left: 120, right: 120 }
  });

  const ansHeaderRow = new TableRow({
    children: [
      mkCellAns('번호', { bold:true, color:'ffffff', fill:'1c2b3a', w: W*0.10 }),
      mkCellAns('문제', { bold:true, color:'ffffff', fill:'1c2b3a', w: W*0.35 }),
      mkCellAns('정답', { bold:true, color:'ffffff', fill:'1c2b3a', w: W*0.55 }),
    ],
    tableHeader: true
  });

  const ansDataRows = state.articles.map((art, i) => {
    const bg = i%2===0?'fffdf5':'ffffff';
    let ansText = '';
    if (art.type === 'blank') {
      ansText = (art.blanks||[]).map((b,bi) => `${bi+1}. ${b.answer}`).join('  /  ');
    } else if (art.type === 'choice') {
      ansText = CHOICE_LABELS[art.answerIdx] || String(art.answerIdx+1);
    } else if (art.type === 'multi') {
      const labels = (art.answerIdxs||[]).map(i=>{
        const c=art.choices&&art.choices[i];
        return c?(c.label||MULTI_DEFAULT_LABELS[i]||String(i+1)):'?';
      });
      ansText = labels.join(', ');
    } else if (art.type === 'cloze') {
      ansText = (art.clozeAnswers||[]).map((a,i)=>`${i+1}. ${a}`).join('  ');
    } else {
      ansText = art.answer || '(서술형)';
    }
    return new TableRow({ children: [
      mkCellAns(art.num,   { bold:true, color:'a3312a', fill:bg, w: W*0.10 }),
      mkCellAns(art.title, { fill:bg, w: W*0.35 }),
      mkCellAns(ansText,   { bold:true, color:'3f6b3f', fill:bg, w: W*0.55 }),
    ]});
  });

  tableChildren.push(new Table({
    rows: [ansHeaderRow, ...ansDataRows],
    width: { size: W, type: WidthType.DXA }
  }));

  /* ── 해설 정리 표 ── */
  const hasExp = state.articles.some(a => a.explanation);
  if (hasExp) {
    tableChildren.push(new Paragraph({
      children: [new TextRun({ text: '해설 정리', bold: true, size: 40, color: '1c2b3a' })],
      spacing: { before: 400, after: 200 },
      border: { bottom: { style: BorderStyle.DOUBLE, size: 6, color: 'c9bd9a' } }
    }));

    const mkCell = (text, opts={}) => new TableCell({
      children: [new Paragraph({
        children: [new TextRun({ text, size: opts.size||20, bold: opts.bold||false, color: opts.color||'1c2b3a' })],
        spacing: { before: 60, after: 60 }
      })],
      width: opts.w ? { size: opts.w, type: WidthType.DXA } : undefined,
      shading: opts.fill ? { fill: opts.fill } : undefined,
      margins: { top: 80, bottom: 80, left: 120, right: 120 }
    });
    const mkExpCell = (text, opts={}) => {
      const LINK_RE = /\[((?:[^\[\]]|\[[^\[\]]*\])+)\]\((https?:\/\/[^\s()]*(?:\([^\s()]*\)[^\s()]*)*)\)/g;
      const children = [];
      let last = 0, m;
      LINK_RE.lastIndex = 0;
      while ((m = LINK_RE.exec(text)) !== null) {
        if (m.index > last) children.push(new TextRun({ text: text.slice(last, m.index), size: opts.size||20, color: opts.color||'1c2b3a' }));
        children.push(new ExternalHyperlink({ link: m[2], children: [new TextRun({ text: m[1], size: opts.size||20, color: '4060c8', style: 'Hyperlink' })] }));
        last = m.index + m[0].length;
      }
      if (last < text.length) children.push(new TextRun({ text: text.slice(last), size: opts.size||20, color: opts.color||'1c2b3a' }));
      return new TableCell({
        children: [new Paragraph({ children: children.length ? children : [new TextRun({ text, size: opts.size||20 })], spacing: { before: 60, after: 60 } })],
        width: opts.w ? { size: opts.w, type: WidthType.DXA } : undefined,
        shading: opts.fill ? { fill: opts.fill } : undefined,
        margins: { top: 80, bottom: 80, left: 120, right: 120 }
      });
    };

    const hasUnit   = state.articles.some(a => a.unit);
    const hasIntent = state.articles.some(a => a.intent);
    const wNum   = W*0.08;
    const wTitle = W*0.22;
    const wUnit  = hasUnit   ? W*0.13 : 0;
    const wInt   = hasIntent ? (hasUnit ? W*0.12 : W*0.25) : 0;
    const wExp   = W - wNum - wTitle - wUnit - wInt;

    const wAns  = W*0.15;
    const wExp2 = W - wNum - wTitle - wAns - wUnit - wInt;

    const hdrCells = [
      mkCell('번호', { bold:true, color:'ffffff', fill:'1c2b3a', w: wNum }),
      mkCell('문제', { bold:true, color:'ffffff', fill:'1c2b3a', w: wTitle }),
      mkCell('정답', { bold:true, color:'ffffff', fill:'1c2b3a', w: wAns }),
      mkCell('해설', { bold:true, color:'ffffff', fill:'1c2b3a', w: wExp2 }),
    ];
    if(hasUnit)   hdrCells.push(mkCell('출제 단원', { bold:true, color:'ffffff', fill:'1c2b3a', w: wUnit }));
    if(hasIntent) hdrCells.push(mkCell('출제 의도', { bold:true, color:'ffffff', fill:'1c2b3a', w: wInt }));

    const getAnsText = (art) => {
      if (art.type === 'blank') return (art.blanks||[]).map((b,bi)=>`${bi+1}. ${b.answer}`).join(' / ');
      if (art.type === 'choice') return CHOICE_LABELS[art.answerIdx] || String((art.answerIdx||0)+1);
      if (art.type === 'multi') {
        return (art.answerIdxs||[]).map(i=>{
          const c=art.choices&&art.choices[i];
          return c?(c.label||MULTI_DEFAULT_LABELS[i]||String(i+1)):'?';
        }).join(', ');
      }
      return art.answer || '';
    };

    const dataRows = state.articles.filter(a=>a.explanation).map((art,i)=>{
      const bg=i%2===0?'fffdf5':'ffffff';
      const rc=[
        mkCell(art.num,          { bold:true, color:'a3312a', fill:bg, w: wNum }),
        mkCell(art.title,        { bold:true, fill:bg, w: wTitle }),
        mkCell(getAnsText(art),  { bold:true, color:'3f6b3f', fill:bg, w: wAns }),
        mkExpCell(art.explanation||'', { fill:bg, w: wExp2 }),
      ];
      if(hasUnit)   rc.push(mkCell(art.unit||'',   { fill:bg, w: wUnit }));
      if(hasIntent) rc.push(mkCell(art.intent||'', { fill:bg, w: wInt }));
      return new TableRow({ children: rc });
    });

    tableChildren.push(new Table({
      rows: [new TableRow({ children: hdrCells, tableHeader: true }), ...dataRows],
      width: { size: W, type: WidthType.DXA }
    }));
  }

  /* ── 3섹션 문서 조립 ── */
  const doc = new Document({
    sections: [
      {
        /* 제목 섹션 — continuous로 끝내서 같은 페이지에서 2단으로 전환 */
        properties: { ...PAGE_PROP, type: SectionType ? SectionType.CONTINUOUS : 'continuous' },
        children: titleChildren
      },
      {
        /* 문제 섹션 — 2단 컬럼, Word가 1→2→3→4 순서로 자동 배치 */
        properties: { ...PAGE_PROP, column: { space: 500, count: 2 } },
        children: qChildren
      },
      {
        /* 정답·해설 표 섹션 — 새 페이지, 전체폭 */
        properties: { ...PAGE_PROP },
        children: tableChildren
      }
    ]
  });

  try {
    const blob = await Packer.toBlob(doc);
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `${cfg.title}_문제지.docx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('DOCX 생성 중 오류가 발생했습니다: ' + e.message);
  }
}

/* ── 퀴즈 세트 관리 ─────────────────────────────────── */
let _adminSets = [];
let _editingSetId = null;

async function loadSetList(){
  const inner = document.getElementById('setListInner');
  if(!inner) return;
  inner.innerHTML = '<p style="color:var(--muted);font-size:13px">불러오는 중…</p>';
  const {data, error} = await sb.from('quiz_sets').select('id,name,description,config').order('created_at',{ascending:false});
  if(error){ inner.innerHTML=`<p style="color:var(--bad);font-size:13px">오류: ${error.message}</p>`; return; }
  _adminSets = data||[];
  if(!_adminSets.length){
    inner.innerHTML='<p style="color:var(--muted);font-size:13px">등록된 퀴즈 세트가 없습니다.</p>'; return;
  }
  inner.innerHTML = _adminSets.map(s=>`
    <div class="art-row">
      <div class="art-info">
        <b>${esc(s.name)}</b>
        <small>${esc(s.description||'')}</small>
      </div>
      <div class="art-btns">
        <button onclick="editSetQuestions('${s.id}')">문제 편집</button>
        <button onclick="openEditSet('${s.id}')">세트 편집</button>
        <button class="del" onclick="deleteSet('${s.id}')">삭제</button>
      </div>
    </div>`).join('');
}

function _fillSetForm(s){
  const cfg = s?.config || {};
  document.getElementById('ef-set-name').value  = s?.name||'';
  document.getElementById('ef-set-desc').value  = s?.description||'';
  document.getElementById('ef-set-title').value = cfg.title||'성공적인 직업생활';
  document.getElementById('ef-set-sub').value   = cfg.sub||'';
  document.getElementById('ef-set-issue').value = cfg.issue||'';
  document.getElementById('ef-set-date').value  = cfg.date||'';
  document.getElementById('ef-set-footer').value= cfg.footer||'';
  document.getElementById('ef-exp-password').value= cfg.expPassword||'';
}
function openAddSet(){
  _editingSetId = null;
  document.getElementById('setEditTitle').textContent='퀴즈 세트 추가';
  _fillSetForm(null);
  document.getElementById('tab-sets').style.display='none';
  document.getElementById('setEditSection').style.display='block';
}
function openEditSet(id){
  const s = _adminSets.find(x=>x.id===id);
  if(!s) return;
  _editingSetId = id;
  document.getElementById('setEditTitle').textContent='퀴즈 세트 편집';
  _fillSetForm(s);
  document.getElementById('tab-sets').style.display='none';
  document.getElementById('setEditSection').style.display='block';
}
function cancelSetEdit(){
  document.getElementById('setEditSection').style.display='none';
  document.getElementById('tab-sets').style.display='block';
}
async function saveSet(){
  const name=document.getElementById('ef-set-name').value.trim();
  if(!name){alert('세트 이름을 입력하세요.');return;}
  const payload={
    name,
    description:document.getElementById('ef-set-desc').value.trim(),
    config:{
      title: document.getElementById('ef-set-title').value.trim(),
      sub:   document.getElementById('ef-set-sub').value.trim(),
      issue: document.getElementById('ef-set-issue').value.trim(),
      date:  document.getElementById('ef-set-date').value.trim(),
      footer:document.getElementById('ef-set-footer').value.trim(),
      expPassword:document.getElementById('ef-exp-password').value.trim()
    }
  };
  let error;
  if(_editingSetId){
    ({error}=await sb.from('quiz_sets').update(payload).eq('id',_editingSetId));
  } else {
    ({error}=await sb.from('quiz_sets').insert({...payload,articles:[]}));
  }
  if(error){ alert('오류: '+error.message); return; }
  cancelSetEdit(); loadSetList();
}
async function deleteSet(id){
  if(!confirm('퀴즈 세트를 삭제하시겠습니까? 문제가 모두 삭제됩니다.')) return;
  const {error}=await sb.from('quiz_sets').delete().eq('id',id);
  if(error){ alert('오류: '+error.message); return; }
  if(currentSetId===id){ currentSetId=null; state.articles=[]; }
  loadSetList();
}
async function editSetQuestions(id){
  const {data} = await sb.from('quiz_sets').select('*').eq('id',id).single();
  if(!data) return;
  currentSetId = id;
  state.articles = data.articles||[];
  state.config   = data.config||state.config;
  switchTab('articles');
  populateSetSelector(id);
}

function populateSetSelector(selectedId){
  const sel = document.getElementById('set-selector');
  if(!sel) return;
  sel.innerHTML = '<option value="">— 퀴즈 세트 선택 —</option>' +
    _adminSets.map(s=>`<option value="${s.id}" ${s.id===selectedId?'selected':''}>${esc(s.name)}</option>`).join('');
}

async function onSetSelectorChange(id){
  if(!id){ state.articles=[]; currentSetId=null; renderArticleList(); return; }
  const {data} = await sb.from('quiz_sets').select('*').eq('id',id).single();
  if(!data) return;
  currentSetId = id;
  state.articles = data.articles||[];
  state.config   = data.config||state.config;
  renderArticleList();
}

async function addStudent(){
  const name=document.getElementById('new-stu-name').value.trim();
  const pin =document.getElementById('new-stu-pin').value.trim();
  if(!name){alert('이름을 입력하세요.');return;}

async function deleteStudent(id,name){

/* ── 성적 현황 ───────────────────────────────────────── */
async function initResultsTab(){
  const sel=document.getElementById('res-set-selector');
  if(!sel) return;
  const {data}=await sb.from('quiz_sets').select('id,name').order('created_at',{ascending:false});
  sel.innerHTML='<option value="">— 퀴즈 세트 선택 —</option>'+
    (data||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  document.getElementById('resultsInner').innerHTML='';
}

async function loadResults(setId){
  const inner=document.getElementById('resultsInner');
  if(!setId){ inner.innerHTML=''; return; }
  inner.innerHTML='<p style="color:var(--muted);font-size:13px">불러오는 중…</p>';

  /* 해당 세트의 모든 제출 + 학생 이름 */
  const {data:subs}=await sb.from('submissions')
    .select('id,earned,total,submitted_at,answers,student_id,students(name)')
    .eq('quiz_set_id',setId)
    .order('submitted_at',{ascending:false});

  /* 퀴즈 세트 문제 목록 (정답 확인용) */
  const {data:qs}=await sb.from('quiz_sets').select('articles').eq('id',setId).single();
  const articles=(qs?.articles)||[];

  if(!subs||!subs.length){
    inner.innerHTML='<p style="color:var(--muted);font-size:13px">제출 기록이 없습니다.</p>'; return;
  }

  /* 학생별로 그룹핑 */
  const byStudent={};
  subs.forEach(s=>{
    const name=s.students?.name||'(알 수 없음)';
    if(!byStudent[s.student_id]) byStudent[s.student_id]={name,attempts:[]};
    byStudent[s.student_id].attempts.push(s);
  });

  let html=`<table class="res-table">
    <thead><tr><th>이름</th><th>최고점</th><th>최근점수</th><th>횟수</th><th>마지막 시도</th><th></th></tr></thead>
    <tbody>`;

  Object.entries(byStudent).forEach(([sid,{name,attempts}])=>{
    const best=Math.max(...attempts.map(a=>a.earned));
    const latest=attempts[0];
    const d=new Date(latest.submitted_at);
    const ts=`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    html+=`<tr>
      <td><b>${esc(name)}</b></td>
      <td class="score-hi">${best}/${latest.total}점</td>
      <td>${latest.earned}/${latest.total}점</td>
      <td>${attempts.length}회</td>
      <td>${ts}</td>
      <td><button class="btn-detail" onclick="toggleDetail('${sid}')">상세</button></td>
    </tr>
    <tr id="detail-row-${sid}" style="display:none">
      <td colspan="6" style="padding:0">
        ${buildDetailHtml(sid,attempts,articles)}
      </td>
    </tr>`;
  });

  html+='</tbody></table>';
  inner.innerHTML=html;
}

function toggleDetail(sid){
  const row=document.getElementById('detail-row-'+sid);
  if(!row) return;
  row.style.display=row.style.display==='none'?'table-row':'none';
}

function buildDetailHtml(sid,attempts,articles){
  let html='<div class="detail-panel">';
  attempts.forEach((att,ai)=>{
    const d=new Date(att.submitted_at);
    const ts=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    html+=`<div class="attempt-row">
      <div class="attempt-meta">${ai===0?'<b>최근</b> · ':''}${ts} &nbsp;|&nbsp; <b>${att.earned}/${att.total}점</b></div>
      <div class="attempt-answers">`;
    articles.forEach(art=>{
      if(art.type==='blank'){
        (art.blanks||[]).forEach(b=>{
          const val=att.answers?.[b.id]??'';
          const ok=norm(val)===norm(b.answer);
          html+=`<div class="ans-item ${ok?'ok':'ng'}">
            <span class="ans-q">${esc(art.num)}-${esc(b.id.slice(-3))}</span>
            <span class="ans-v">${esc(val)||'(미입력)'}</span>
            ${!ok?`<span style="color:var(--muted);font-size:11px">정답: ${esc(b.answer)}</span>`:''}
          </div>`;
        });
      } else if(art.type==='choice'){
        const sel=att.answers?.[art.id];
        const ok=sel===art.answerIdx;
        const LABELS=['①','②','③','④','⑤'];
        html+=`<div class="ans-item ${ok?'ok':'ng'}">
          <span class="ans-q">${esc(art.num)}</span>
          <span class="ans-v">${sel!=null?LABELS[sel]:'(미선택)'}</span>
          ${!ok?`<span style="color:var(--muted);font-size:11px">정답: ${LABELS[art.answerIdx]}</span>`:''}
        </div>`;
      } else if(art.type==='essay'){
        const val=att.answers?.[art.id]??'';
        html+=`<div class="ans-item" style="color:var(--ink-soft)">
          <span class="ans-q">${esc(art.num)}</span>
          <span class="ans-v" style="font-weight:400">${esc(val)||'(미입력)'}</span>
        </div>`;
      }
    });
    html+='</div></div>';
  });
  html+='</div>';
  return html;
}

let _quizSets      = [];
let _selectedSet   = null;
let _currentStudent= null;
let _expMode       = false;

async function loadHome(){
  document.getElementById('homeScreen').style.display='block';
  document.getElementById('app').style.display='none';
  const grid=document.getElementById('quizGrid');
  grid.innerHTML='<div class="home-loading">불러오는 중…</div>';
  const {data,error}=await sb.from('quiz_sets').select('id,name,description,config').order('created_at',{ascending:false});
  if(error||!data){
    grid.innerHTML='<div class="home-loading">불러오기 실패. 새로고침 해보세요.</div>';
    return;
  }
  _quizSets=data;
  if(!data.length){
    grid.innerHTML='<div class="home-loading">등록된 퀴즈가 없습니다.<br>관리자 패널에서 추가하세요.</div>';
    return;
  }
  grid.innerHTML=data.map(qs=>{
    const hasExp=!!(qs.config?.expPassword);
    return `<div class="quiz-card">
      <div onclick="pickQuizSet('${qs.id}')" style="cursor:pointer;flex:1">
        <div class="quiz-card-name">${esc(qs.name)}</div>
        <div class="quiz-card-desc">${esc(qs.description||'')}</div>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;justify-content:flex-end">
        <button onclick="pickQuizSet('${qs.id}')" style="font-family:'Noto Serif KR',serif;font-weight:700;font-size:12px;background:var(--ink);color:var(--paper);border:none;padding:6px 14px;border-radius:2px;cursor:pointer;">풀기</button>
        ${hasExp?`<button onclick="openExpLogin('${qs.id}')" style="font-family:'Noto Serif KR',serif;font-weight:700;font-size:12px;background:rgba(180,140,50,.15);color:#7a5c10;border:1px solid rgba(180,140,50,.4);padding:6px 14px;border-radius:2px;cursor:pointer;">해설 보기</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function pickQuizSet(id){
  _selectedSet=_quizSets.find(q=>q.id===id);
  document.getElementById('sl-quiz-name').textContent=_selectedSet?.name||'';
  document.getElementById('sl-name').value='';
  document.getElementById('sl-pin').value='';
  document.getElementById('slErr').textContent='';
  document.getElementById('studentLogin').classList.add('show');
  setTimeout(()=>document.getElementById('sl-name').focus(),80);
}

function cancelStudentLogin(){
  document.getElementById('studentLogin').classList.remove('show');
}

async function doStudentLogin(){
  const name=document.getElementById('sl-name').value.trim();
  const pin =document.getElementById('sl-pin').value.trim();
  const err =document.getElementById('slErr');
  if(!name){err.textContent='이름을 입력하세요.';return;}
  if(!/^\d{4}$/.test(pin)){err.textContent='4자리 숫자를 입력하세요.';return;}
  err.textContent='확인 중…';

  /* students 테이블에서 이름+PIN 조회 */
  const {data,error}=await sb.from('students').select('id,name,pin').eq('name',name).eq('pin',pin);
  if(error){err.textContent='오류가 발생했습니다.';return;}
  if(!data||!data.length){err.textContent='이름 또는 번호가 맞지 않습니다.';return;}

  _currentStudent=data[0];
  document.getElementById('studentLogin').classList.remove('show');
  document.getElementById('homeScreen').style.display='none';
  document.getElementById('app').style.display='block';

  /* 선택한 퀴즈 세트 로드 */
  const {data:full}=await sb.from('quiz_sets').select('*').eq('id',_selectedSet.id).single();
  if(full){
    state.articles=full.articles||[];
    state.config=full.config||state.config;
  }
  choiceState={}; multiState={}; _expMode=false; renderQuiz();
}

/* ── 해설 보기 ──────────────────────────────────────── */
function openExpLogin(id){
  _selectedSet=_quizSets.find(q=>q.id===id);
  document.getElementById('el-quiz-name').textContent=_selectedSet?.name||'';
  document.getElementById('el-password').value='';
  document.getElementById('elErr').textContent='';
  document.getElementById('expLogin').classList.add('show');
  setTimeout(()=>document.getElementById('el-password').focus(),80);
}
function closeExpLogin(){
  document.getElementById('expLogin').classList.remove('show');
}
async function doExpLogin(){
  const pw=document.getElementById('el-password').value.trim();
  const err=document.getElementById('elErr');
  if(!pw){err.textContent='비밀번호를 입력하세요.';return;}
  const correct=_selectedSet?.config?.expPassword||'';
  if(!correct){err.textContent='해설 비밀번호가 설정되지 않은 세트입니다.';return;}
  if(pw!==correct){err.textContent='비밀번호가 틀렸습니다.';return;}

  document.getElementById('expLogin').classList.remove('show');
  document.getElementById('homeScreen').style.display='none';
  document.getElementById('app').style.display='block';

  const {data:full}=await sb.from('quiz_sets').select('*').eq('id',_selectedSet.id).single();
  if(full){
    state.articles=full.articles||[];
    state.config=full.config||state.config;
  }
  _currentStudent=null;
  choiceState={}; multiState={}; _expMode=true; renderQuiz();
  state.articles.forEach(art=>showExp(art.id));
  revealAllAnswers();
}

/* ── 초기화 ─────────────────────────────────────────── */
loadHome();
</script>
</body>
</html>
